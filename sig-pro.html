<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Vista Oceans Signature — Pro (paste source)</title></head>
<body style="margin:24px; background:#ffffff;">
<button id="copyBtn" style="font-family:Arial,sans-serif; font-size:14px; padding:10px 22px; margin-bottom:28px; background:#171310; color:#faf6ee; border:1px solid #b9904f; border-radius:999px; cursor:pointer;">Copy signature</button>
<div id="copyStatus" style="font-family:Arial,sans-serif; font-size:12px; color:#96702f; margin-bottom:16px;"></div>

<div id="sig">
<table cellpadding="0" cellspacing="0" border="0" role="presentation">
  <tr>
    <td style="vertical-align:middle; padding-right:18px;">
      <a href="https://vista.genovesi.us" style="text-decoration:none;"><img src="https://vista.genovesi.us/assets/seal-round.png" width="94" height="94" alt="Vista Oceans" style="display:block; border:0;"></a>
    </td>
    <td style="vertical-align:middle; border-left:1px solid #d9b878; padding-left:18px;">
      <div style="font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif; font-size:23px; line-height:1.15; color:#171310; letter-spacing:0.4px;">Bennett Genovesi</div>
      <div style="font-family:Arial,Helvetica,sans-serif; font-size:10px; letter-spacing:2.6px; color:#96702f; padding-top:6px;">VISTA OCEANS LLC</div>
      <div style="font-family:Arial,Helvetica,sans-serif; font-size:11.5px; color:#6f655a; padding-top:10px;">(646) 401-2401 &nbsp;·&nbsp; <a href="mailto:bennett@genovesi.us" style="color:#96702f; text-decoration:none;">bennett@genovesi.us</a> &nbsp;·&nbsp; <a href="https://vista.genovesi.us" style="color:#96702f; text-decoration:none;">vista.genovesi.us</a></div>
    </td>
  </tr>
</table>
</div>

<script>
document.getElementById('copyBtn').addEventListener('click', async function () {
  var node = document.getElementById('sig');
  var html = node.innerHTML;
  var status = document.getElementById('copyStatus');
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type: 'text/html'}),
      'text/plain': new Blob([node.innerText], {type: 'text/plain'})
    })]);
    status.textContent = 'Copied — ready to paste into Gmail.';
  } catch (e) {
    var range = document.createRange();
    range.selectNodeContents(node);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok = document.execCommand('copy');
    status.textContent = ok ? 'Copied (fallback) — ready to paste into Gmail.' : 'Copy failed: ' + e;
  }
});
</script>
</body></html>
